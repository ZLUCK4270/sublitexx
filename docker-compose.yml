version: "3.8"

services:
  frontend:
    build: .
    container_name: sublitexx-web
    ports:
      - "8080:80"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: sublitexx-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sublitexx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

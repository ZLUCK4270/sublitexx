version: "3.8"

services:
  web:
    build: .
    container_name: sublitexx-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/sublitexx?schema=public

  db:
    image: postgres:15-alpine
    container_name: sublitexx-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: sublitexx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
